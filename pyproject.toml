

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "CQD_SS2026"
version = "1.0.0"
description = "Exercise 1 for Computational Quantum Dynamics"
readme = "README.md"
requires-python = ">=3.9" 
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "IPython",
    "notebook",
]

[project.optional-dependencies]
test = [
    "pytest",
    "nbconvert",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
